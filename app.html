<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Forbidden Library · Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060918">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/library.css">
<link rel="stylesheet" href="css/voice.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/features.css">
<link rel="stylesheet" href="css/social.css">
<link rel="stylesheet" href="css/study.css">
<link rel="stylesheet" href="css/tutorial.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<header id="top">
  <a class="brand" href="./" aria-label="Home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 18 9 9l6 5 5-10"/><circle cx="4" cy="18" r="1.6" fill="currentColor"/><circle cx="9" cy="9" r="1.6" fill="currentColor"/><circle cx="15" cy="14" r="1.6" fill="currentColor"/><circle cx="20" cy="4" r="1.6" fill="currentColor"/></svg><span>Forbidden Library</span></a>
  <div id="tabs" role="tablist" aria-label="Constellations"></div>
  <input id="search" type="search" placeholder="Search stars…  ( / )" aria-label="Search nodes">
  <div class="tools">
    <button class="btn" id="btnAdd" title="New star (N)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg><span class="lbl">Star</span></button>
    <button class="btn" id="btnMedia" title="Add images or videos (M)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.7"/><path d="M21 16l-5-5-8 9"/></svg><span class="lbl">Media</span></button>
    <button class="btn" id="btnPen" title="Draw (P)" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="lbl">Pen</span></button>
    <button class="btn" id="btnCollab" title="Room"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M17.5 14c2.5 0 4.5 2 4.5 4.5"/></svg><span class="lbl">Room</span></button>
    <button class="btn" id="btnLib" title="Library (L)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="lbl">Library</span></button>
    <button class="btn" id="btnTools" title="Tools: study, journeys, universe, activity…" aria-label="Tools"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
    <button class="btn" id="btnSettings" title="Settings" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="btn" id="btnK" title="Command palette (Ctrl/⌘ K)" aria-label="Command palette"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg></button>
  </div>
</header>

<div id="statusbar" class="mono"><i id="dot"></i><span id="statusText">Personal · saved</span><span id="peers"></span></div>

<main id="stage">
  <div id="viewport" tabindex="0" aria-label="Map canvas">
    <div id="world">
      <svg id="svg" class="layer" width="1" height="1"></svg>
      <svg id="drawSvg" class="layer" width="1" height="1"></svg>
    </div>
    <div id="cursors"></div>
    <div id="empty" hidden><h2 class="serif">An empty sky</h2><p>Double-click anywhere, press <kbd>N</kbd>, or drop a file to place your first star.</p></div>
  </div>
  <div id="hud">
    <button class="btn" id="zOut" aria-label="Zoom out">−</button>
    <button class="btn mono" id="zVal" aria-label="Fit all">100%</button>
    <button class="btn" id="zIn" aria-label="Zoom in">+</button>
  </div>
  <canvas id="minimap" width="170" height="110" aria-label="Minimap"></canvas>
  <div id="ctxbar" class="panel-lite" hidden></div>
  <div id="penbar" class="panel-lite" hidden></div>
</main>

<button id="libTab" class="btn" aria-label="Open library"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Library</button>
<aside id="library" aria-label="Library">
  <div class="lib-head"><h2 class="serif">Library</h2><button class="btn" id="libClose" aria-label="Collapse library">‹</button></div>
  <div class="lib-tabs"><button class="btn on" data-tab="main">Books</button><button class="btn" data-tab="tr">Translated</button></div>
  <div class="lib-actions"><button class="btn" id="addVol">＋ Volume</button><button class="btn" id="addFolder">＋ Folder</button></div>
  <input id="libSearch" type="search" placeholder="Search all texts…" aria-label="Search library">
  <div id="collection"></div>
</aside>

<div id="reader" hidden></div>

<div id="menu" class="menu" role="menu" hidden></div>
<div id="palette" role="dialog" aria-label="Command palette" hidden>
  <input id="palInput" type="text" placeholder="Type a command or a star name…" autocomplete="off">
  <ul id="palList"></ul>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileAny" hidden multiple accept="image/*,video/*,.pdf,.epub,application/pdf,application/epub+zip,.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
